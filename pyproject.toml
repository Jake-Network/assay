[project]
name = "assay"
version = "0.1.0.dev0"
description = "Your agents' lab notebook. Nothing they find gets lost, repeated, or trusted without evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pixeltable-pgserver>=0.7.2",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "typer>=0.12",
  "mcp>=2.3,<3",
  "starlette>=0.37",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
examples = ["numpy>=1.26", "scipy>=1.12"]

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "numpy>=1.26", "scipy>=1.12",
       "matplotlib>=3.8", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pixeltable_pgserver.*", "alembic.*"]
ignore_missing_imports = true
