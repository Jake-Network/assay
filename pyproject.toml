[project]
name = "benchbook"
dynamic = ["version"]
description = "\"Done\" is a claim until the tests say so: re-run your coding agents' checks on the reported commit, flag weakened tests, keep what was verified."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["agents", "multi-agent", "claude-code", "mcp", "experiment-tracking", "reproducibility", "verification",
            "ledger", "autoresearch", "postgres"]
# Only what CI runs: Linux and macOS, Python 3.11 to 3.13. The licence is the SPDX expression above (PEP 639), so
# there is no licence classifier.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pixeltable-pgserver>=0.7.2",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "typer>=0.12",
  "mcp>=2.3,<3",
  "starlette>=0.37",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/Jake-Network/benchbook"
Documentation = "https://github.com/Jake-Network/benchbook/tree/main/docs"
Repository = "https://github.com/Jake-Network/benchbook"
Issues = "https://github.com/Jake-Network/benchbook/issues"
Changelog = "https://github.com/Jake-Network/benchbook/blob/main/CHANGELOG.md"

[project.optional-dependencies]
examples = ["numpy>=1.26", "scipy>=1.12"]

[project.scripts]
benchbook = "benchbook.entry:main"
# the command's name before the rename, kept during 0.1.x: hooks and plugins installed then still call it
assay = "benchbook.entry:legacy_main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.8", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "numpy>=1.26",
       "scipy>=1.12", "matplotlib>=3.8", "types-jsonschema"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from git: 0.1.0 on the v0.1.0 tag, 0.1.devN+g<commit> between tags, so every install can say
# which commit it was built from (`benchbook --version`).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/benchbook/_version.py"

[tool.uv]
# rebuild a local install when the commit or tags change, not only when pyproject.toml does
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.sdist]
# Only what the repository tracks: hatch reads .gitignore but not .git/info/exclude or the global excludes, so local
# files (.claude/, working notes) would otherwise ship. tests/test_packaging.py keeps this list in step with git.
only-include = [".claude-plugin", ".github", ".gitignore", "CHANGELOG.md", "CLAUDE.md", "DECISIONS.md", "LICENSE",
                "MANUAL_QA.md", "README.ko.md", "README.md", "bench", "docker-compose.yml", "docs", "examples",
                "integrations", "pyproject.toml", "scripts", "src", "tests", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchbook"]

# `benchbook install --harness codex|cursor|gemini` copies these manifests from the installed package.
[tool.hatch.build.targets.wheel.force-include]
"integrations/codex/hooks.json" = "benchbook/manifests/codex/hooks.json"
"integrations/cursor/hooks.json" = "benchbook/manifests/cursor/hooks.json"
"integrations/gemini/hooks.json" = "benchbook/manifests/gemini/hooks.json"

[tool.ruff]
line-length = 120
target-version = "py311"
# Published benchmark inputs are kept byte for byte: their sha256 is in a pre-registration.
extend-exclude = ["bench/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pixeltable_pgserver.*", "alembic.*"]
ignore_missing_imports = true
