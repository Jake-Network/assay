# Shared ledger for teams and several machines (docs/multi-machine.md).
# Put BENCHBOOK_DB_PASSWORD=<something long> in a .env file next to this one, then:
# export BENCHBOOK_DATABASE_URL=postgresql://benchbook:<password>@localhost:5432/benchbook
# The port is published on 127.0.0.1 only. For other machines, change it to "<this host's LAN or VPN address>:5432:5432"
# and allow that network in your firewall; never publish it on 0.0.0.0 on a public network.
# A server started before the rename (user, database and volume named assay) keeps its data in the old volume: run it
# with the compose file it was started with, not this one, which would start an empty server (docs/multi-machine.md).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: benchbook
      POSTGRES_PASSWORD: ${BENCHBOOK_DB_PASSWORD:?set BENCHBOOK_DB_PASSWORD in .env (see docs/multi-machine.md)}
      POSTGRES_DB: benchbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - benchbook-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchbook"]
      interval: 5s
      retries: 10
volumes:
  benchbook-pg:
